name: AI Executor APK

on:
  push:
    branches:
      - main
      - feat/ai-executor-v0.1
    paths:
      - 'ai-executor/**'
      - '.github/workflows/ai-executor-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle -p ai-executor :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-executor-v0.1-debug-apk
          path: ai-executor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
