name: AI Executor APK

on:
  push:
    branches:
      - main
      - feat/ai-executor-v0.1
    tags:
      - 'v*'
    paths:
      - 'ai-executor/**'
      - '.github/workflows/ai-executor-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle -p ai-executor :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-executor-debug-apk
          path: ai-executor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: cp ai-executor/app/build/outputs/apk/debug/app-debug.apk "AI-Executor-${GITHUB_REF_NAME}-debug.apk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "AI-Executor-${GITHUB_REF_NAME}-debug.apk"
          --title "AI Executor $GITHUB_REF_NAME"
          --generate-notes
