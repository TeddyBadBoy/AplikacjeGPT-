<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f0b"><title>OSINT Navigator Live v0.3</title><style>
:root{--bg:#0b0f0b;--panel:#111711;--line:#253025;--lime:#b7ff27;--text:#f2f6f2;--muted:#8d9a8d;--warn:#ffbf00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,sans-serif}header{position:sticky;top:0;z-index:5;background:#0b0f0bf2;border-bottom:1px solid var(--line);padding:14px 16px}main{max-width:760px;margin:auto;padding:16px 14px 110px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}.k{font:700 12px ui-monospace,monospace;letter-spacing:.14em;color:var(--lime)}input,button{font:inherit;width:100%;border-radius:14px;padding:13px;margin-top:8px}input{background:#090d09;color:var(--text);border:1px solid #334033}.btn{border:0;background:var(--lime);font-weight:850;color:#111}.secondary{background:#111;color:#fff;border:1px solid #425242}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:var(--muted)}.big{font-size:36px;font-weight:900}.ok{color:var(--lime)}.bad{color:#ff7777}pre{white-space:pre-wrap;word-break:break-word;background:#080b08;border:1px solid #273227;border-radius:12px;padding:10px;max-height:260px;overflow:auto}.arrow{font-size:86px;text-align:center;color:var(--lime);transform:rotate(0deg);transition:.18s}img{width:100%;border-radius:14px;margin-top:10px;display:none;border:1px solid #2c382c}footer{position:fixed;bottom:0;left:0;right:0;background:#0b0f0bf3;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}footer .row{max-width:760px;margin:auto}
</style></head><body><header><b>⊕ OSINT Navigator Live</b> <span class="muted">v0.3</span></header><main>
<section class="card"><div class="k">00 · IMAGE ANALYZER</div><label>URL zdjęcia</label><input id="imageUrl" value="https://ksalnnh.net/pr/48cb07b7630f2a9efee3bf105dde3754dad357b68ee520729dd7c89668b5be68.jpg"><button class="btn" id="analyze">Analizuj zdjęcie</button><div id="analysisStatus" class="muted" style="margin-top:10px">URL → SHA-256 → EXIF → AI/OCR → kandydaci GPS</div><img id="reference"><pre id="analysis">Brak analizy.</pre></section>
<section class="card"><div class="k">01 · CEL</div><label>Współrzędne</label><input id="target" placeholder="52.1914531, 21.0060642"><div class="row"><button class="btn" id="setTarget">Ustaw cel</button><button class="btn secondary" id="map">Mapa</button></div></section>
<section class="card"><div class="k">02 · LIVE NAVIGATION</div><div id="arrow" class="arrow">↑</div><div id="distance" class="big">—</div><div id="instruction">Włącz GPS</div><div id="details" class="muted">GPS + kompas</div><div class="row"><button class="btn secondary" id="street">Street View</button><button class="btn secondary" id="camera">Kamera AR</button></div><video id="video" autoplay playsinline muted style="display:none;width:100%;margin-top:10px;border-radius:14px"></video></section>
<section class="card"><div class="k">03 · VISION CONFIRMATION</div><p class="muted">Referencja = URL analizowanego zdjęcia. Zrób aktualne zdjęcie i porównaj.</p><input id="livePhoto" type="file" accept="image/*" capture="environment"><img id="livePreview"><button class="btn" id="compare">Porównaj miejsce AI</button><pre id="compareResult">Brak porównania.</pre></section>
</main><footer><div class="row"><button class="btn" id="gps">▶ GPS</button><button class="btn secondary" id="stop">■ Stop</button></div></footer><script>
const $=s=>document.querySelector(s);let target=null,lastPos=null,watchId=null,heading=null,referenceImageUrl='',stream=null;
function parseCoord(v){const m=v.match(/(-?\d{1,2}(?:\.\d+)?)\s*[,; ]\s*(-?\d{1,3}(?:\.\d+)?)/);if(!m)return null;const p={lat:+m[1],lon:+m[2]};return Math.abs(p.lat)<=90&&Math.abs(p.lon)<=180?p:null}
function rad(x){return x*Math.PI/180}function deg(x){return x*180/Math.PI}function hav(a,b){const R=6371000,dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon),s=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(s))}function bearing(a,b){const y=Math.sin(rad(b.lon-a.lon))*Math.cos(rad(b.lat)),x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lon-a.lon));return(deg(Math.atan2(y,x))+360)%360}
function update(){if(!lastPos||!target)return;const d=hav(lastPos,target),br=bearing(lastPos,target),rel=heading==null?br:((br-heading+540)%360)-180;$('#distance').textContent=d<1000?Math.round(d)+' m':(d/1000).toFixed(1)+' km';$('#arrow').style.transform=`rotate(${rel}deg)`;$('#instruction').textContent=d<8?'✓ Jesteś przy celu':Math.abs(rel)<20?'Idź prosto':rel>0?'Skręć w prawo':'Skręć w lewo';$('#details').textContent=`Cel ${target.lat.toFixed(6)}, ${target.lon.toFixed(6)} · bearing ${Math.round(br)}°`}
$('#analyze').onclick=async()=>{const url=$('#imageUrl').value.trim();$('#analysisStatus').textContent='Analizuję…';$('#analysis').textContent='';try{const r=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url})});const j=await r.json();$('#analysis').textContent=JSON.stringify(j,null,2);if(!r.ok)throw new Error(j.error||'Analyze failed');referenceImageUrl=url;$('#reference').src=url;$('#reference').style.display='block';const c=j.candidates?.[0];if(c){target={lat:c.lat,lon:c.lon};$('#target').value=`${c.lat}, ${c.lon}`;$('#analysisStatus').innerHTML=`<span class="ok">CANDIDATE_FOUND</span> · ${c.source} · confidence ${Math.round((c.confidence||0)*100)}% · VERIFIED=false`;update()}else $('#analysisStatus').textContent=j.status||'Brak współrzędnych';}catch(e){$('#analysisStatus').innerHTML=`<span class="bad">ANALYZE_FAILED</span> · ${e.message}`}}
$('#setTarget').onclick=()=>{const p=parseCoord($('#target').value);if(!p)return alert('Niepoprawne współrzędne');target=p;update()};
$('#gps').onclick=()=>{if(!target){const p=parseCoord($('#target').value);if(!p)return alert('Najpierw ustaw cel');target=p}watchId=navigator.geolocation.watchPosition(p=>{lastPos={lat:p.coords.latitude,lon:p.coords.longitude};$('#details').textContent=`GPS ±${Math.round(p.coords.accuracy)} m`;update()},e=>alert(e.message),{enableHighAccuracy:true,maximumAge:500,timeout:12000});window.addEventListener('deviceorientationabsolute',e=>{if(e.alpha!=null){heading=(360-e.alpha)%360;update()}},true)};
$('#stop').onclick=()=>{if(watchId!=null)navigator.geolocation.clearWatch(watchId);watchId=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('#video').style.display='none'};
$('#map').onclick=()=>target&&window.open(`https://www.google.com/maps/search/?api=1&query=${target.lat},${target.lon}`,'_blank');$('#street').onclick=()=>target&&window.open(`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${target.lat},${target.lon}`,'_blank');
$('#camera').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('#video').srcObject=stream;$('#video').style.display='block'}catch(e){alert(e.message)}};
$('#livePhoto').onchange=()=>{const f=$('#livePhoto').files[0];if(f){$('#livePreview').src=URL.createObjectURL(f);$('#livePreview').style.display='block'}};function dataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
$('#compare').onclick=async()=>{const f=$('#livePhoto').files[0];if(!referenceImageUrl)return alert('Najpierw przeanalizuj zdjęcie referencyjne');if(!f)return alert('Dodaj aktualne zdjęcie');$('#compareResult').textContent='Analizuję…';try{const r=await fetch('/api/vision',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({reference_image:referenceImageUrl,current_image:await dataUrl(f),target,last_position:lastPos})});const j=await r.json();$('#compareResult').textContent=JSON.stringify(j,null,2)}catch(e){$('#compareResult').textContent=e.message}};
</script></body></html>
